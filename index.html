<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Factura Dental</title>
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Factura Dental">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#f2f2f7; --card:#fff; --text:#1c1c1e; --muted:#6b7280; --line:#e5e5ea;
  --accent:#0f766e; --accent2:#14b8a6; --soft:#e6f6f4; --danger:#dc2626; --warn:#b45309;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#000; --card:#1c1c1e; --text:#f2f2f7; --muted:#9ca3af; --line:#2c2c2e; --soft:#0f2e2b; --accent:#2dd4bf; --accent2:#14b8a6;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body{padding-top:env(safe-area-inset-top);padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:10px 16px 8px;border-bottom:1px solid var(--line)}
header.top h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.3px}
header.top .sub{color:var(--muted);font-size:13px}
main{padding:12px 14px 24px;max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}
.big{font-size:22px;font-weight:700;letter-spacing:-.3px}
.num{font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--soft);border-radius:12px;padding:10px}
.stat .l{font-size:12px;color:var(--muted)}
.stat .v{font-size:17px;font-weight:700}
.stat.hl{background:var(--accent);color:#fff}
.stat.hl .l{color:rgba(255,255,255,.85)}
.datebar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.datebar .lbl{flex:1;text-align:center;font-weight:600;position:relative;background:var(--card);border-radius:12px;padding:9px 6px}
.datebar .lbl input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.iconbtn{border:0;background:var(--card);color:var(--accent);width:42px;height:42px;border-radius:12px;font-size:20px;font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:7px 13px;font-size:14px;display:flex;align-items:center;gap:6px}
.chip.on{border-color:var(--accent);background:var(--soft);color:var(--accent);font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.list{background:var(--card);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
.item{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.item:last-child{border-bottom:0}
.item .main{flex:1;min-width:0}
.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .d{color:var(--muted);font-size:14px}
.item .r{text-align:right;flex:none}
.item .r .a{font-weight:700;color:var(--accent)}
.sec{font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin:18px 4px 6px;display:flex;justify-content:space-between}
.empty{text-align:center;color:var(--muted);padding:34px 10px}
.empty .e{font-size:40px}
.btn{border:0;border-radius:12px;padding:13px 16px;font-size:16px;font-weight:600;background:var(--accent);color:#fff;width:100%}
.btn.sec2{background:var(--soft);color:var(--accent)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{background:transparent;color:var(--danger)}
.btn:disabled{opacity:.5}
.btns{display:grid;gap:8px}
.fab{position:fixed;right:18px;bottom:calc(88px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:32px;box-shadow:0 6px 18px rgba(15,118,110,.4);z-index:6}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;display:flex;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;color:var(--muted);padding:8px 0 6px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:25px;height:25px}
nav.tabs button.on{color:var(--accent)}
/* hojas modales */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;padding:8px 14px calc(18px + env(safe-area-inset-bottom));animation:up .2s ease-out}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 8px}
.sheet h2{font-size:19px;margin:4px 0 12px;display:flex;justify-content:space-between;align-items:center}
.sheet h2 button{border:0;background:none;color:var(--accent);font-size:16px;font-weight:600;padding:4px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--muted);margin:0 4px 5px}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--card);border:1.5px solid var(--line);border-radius:11px;padding:11px 12px;outline:none;-webkit-appearance:none;appearance:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input[type=date]{min-height:46px}
.trow{background:var(--card);border-radius:12px;padding:10px;margin-bottom:8px;display:grid;grid-template-columns:1fr 92px;gap:8px;position:relative}
.trow .full{grid-column:1/-1}
.trow .x{position:absolute;top:-7px;right:-5px;width:26px;height:26px;border-radius:50%;border:0;background:var(--danger);color:#fff;font-size:15px;line-height:1}
.totbox{background:var(--accent);color:#fff;border-radius:14px;padding:12px 14px;margin:12px 0}
.totbox .row{justify-content:space-between}
.totbox .big{color:#fff}
details{margin-bottom:12px}
details summary{color:var(--accent);font-weight:600;padding:6px 4px;list-style:none}
details summary::-webkit-details-marker{display:none}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(28,28,30,.92);color:#fff;padding:10px 16px;border-radius:12px;z-index:50;font-size:15px;max-width:86vw;text-align:center}
.dialog{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:24px}
.dialog .box{background:var(--card);border-radius:16px;padding:18px;max-width:340px;width:100%}
.dialog .box p{margin:0 0 14px}
.dialog .box .btns{grid-template-columns:1fr 1fr}
.banner{background:#fef3c7;color:#78350f;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
@media (prefers-color-scheme: dark){.banner{background:#422006;color:#fde68a}}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{color:var(--muted);font-weight:500;font-size:12px}
table.t tr.tot td{font-weight:700;border-bottom:0}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.colors button{width:34px;height:34px;border-radius:50%;border:3px solid transparent}
.colors button.on{border-color:var(--text)}
.switch{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:11px;padding:10px 12px;margin-bottom:12px}
.switch input{width:auto;-webkit-appearance:auto;appearance:auto;transform:scale(1.3)}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.quick button{border:1px dashed var(--accent);background:transparent;color:var(--accent);border-radius:999px;padding:6px 11px;font-size:14px}
</style>
</head>
<body>
<header class="top"><h1 id="title">Jornada</h1><div class="sub" id="subtitle"></div></header>
<main id="main"></main>
<button class="fab" id="fab" aria-label="Añadir registro">+</button>
<nav class="tabs" id="tabs">
  <button data-tab="jornada" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>Jornada</button>
  <button data-tab="resumen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Resumen</button>
  <button data-tab="pacientes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>Pacientes</button>
  <button data-tab="ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Ajustes</button>
</nav>
<datalist id="dl-trat"></datalist>
<datalist id="dl-pac"></datalist>
<script src="xlsx.mini.min.js"></script>
<script>
'use strict';
/* =========================================================
   Factura Dental — control de pacientes, tratamientos y % por clínica
   Los datos se guardan solo en este iPhone (localStorage).
   ========================================================= */
const KEY = 'factura-dental-v1';
const COLORS = ['#0f766e','#2563eb','#d946ef','#ea580c','#16a34a','#dc2626','#7c3aed','#ca8a04'];
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const TRAT_BASE = [
  ['Limpieza dental',30],['Empaste',40],['Empaste complejo',0],['Curetaje',50],['Abfracción',50],
  ['Extracción',60],['Extracción cordal',0],['Restos radiculares (RR)',0],['Endodoncia',0],
  ['Reconstrucción',0],['Perno',30],['Corona',0],['Corona de zirconio',0],['Provisional',40],
  ['Cementado de corona',30],['Tallado',0],['Regularización',0],['Implante',0],['Puente',0],
  ['Carilla',0],['Blanqueamiento',0],['Férula de descarga',0],['Ortodoncia (cuota)',0],
  ['Revisión',0],['Radiografía',0]
];

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur = n => new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',minimumFractionDigits:2,maximumFractionDigits:2}).format(n||0);
const pctTxt = p => (Math.round(p*100)/100).toString().replace('.',',') + ' %';
const num = v => { if (typeof v === 'number') return v; const n = parseFloat(String(v||'').replace(/\s/g,'').replace(',','.')); return isNaN(n)?0:n; };
const r2 = n => Math.round(n*100)/100;
const pad = n => String(n).padStart(2,'0');
const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => isoDate(new Date());
const parseISO = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const fechaLarga = s => parseISO(s).toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const fechaCorta = s => parseISO(s).toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'});
const norm = s => String(s||'').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ');

/* ---------- datos ---------- */
let D = load();
function defaults(){
  return {
    clinicas: [{ id: uid(), nombre: 'Clínica 1', pct: 40, color: COLORS[0], descLab: false, archivada: false }],
    tratamientos: TRAT_BASE.map(([nombre, precio]) => ({ id: uid(), nombre, precio })),
    registros: [],
    ultimaCopia: null,
    ultimaClinica: null
  };
}
function load(){
  try { const s = localStorage.getItem(KEY); if (s) return Object.assign(defaults(), JSON.parse(s)); } catch(e){}
  return defaults();
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(D)); }
  catch(e){ toast('⚠️ No se pudo guardar en el teléfono'); }
}
const clinica = id => D.clinicas.find(c => c.id === id) || { nombre: '(clínica borrada)', pct: 0, color: '#999' };
const clinicasActivas = () => D.clinicas.filter(c => !c.archivada);

// Cálculo de un registro
function calc(r){
  const total = r2((r.items||[]).reduce((s,i) => s + num(i.precio), 0));
  const c = clinica(r.clinicaId);
  const lab = c.descLab ? num(r.lab) : 0;
  const base = Math.max(0, total - lab);
  const fact = r2(base * num(r.pct) / 100);
  return { total, lab, base, fact };
}
const itemsTxt = r => (r.items||[]).map(i => i.trat + (i.piezas ? ' ' + i.piezas : '')).join(' + ');
function sumar(regs){
  let total = 0, fact = 0;
  regs.forEach(r => { const c = calc(r); total += c.total; fact += c.fact; });
  return { n: regs.length, total: r2(total), fact: r2(fact), pac: new Set(regs.map(r => norm(r.paciente) || r.id)).size };
}

/* ---------- estado de la interfaz ---------- */
const UI = { tab: 'jornada', dia: today(), mes: today().slice(0,7), filtro: 'todas', busca: '' };

/* ---------- utilidades de interfaz ---------- */
function toast(msg){
  document.querySelectorAll('.toast').forEach(x => x.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2300);
}
function confirmar(msg, okTxt='Aceptar', peligro=false){
  return new Promise(res => {
    const d = document.createElement('div'); d.className = 'dialog';
    d.innerHTML = `<div class="box"><p>${msg}</p><div class="btns"><button class="btn sec2" data-v="0">Cancelar</button><button class="btn" style="${peligro?'background:var(--danger)':''}" data-v="1">${esc(okTxt)}</button></div></div>`;
    d.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; d.remove(); res(b.dataset.v === '1'); });
    document.body.appendChild(d);
  });
}
function elegir(msg, opciones){ // opciones: [{v, t}]
  return new Promise(res => {
    const d = document.createElement('div'); d.className = 'dialog';
    d.innerHTML = `<div class="box"><p>${msg}</p><div class="btns" style="grid-template-columns:1fr">${opciones.map(o=>`<button class="btn sec2" data-v="${esc(o.v)}">${esc(o.t)}</button>`).join('')}<button class="btn ghost" data-v="">Cancelar</button></div></div>`;
    d.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; d.remove(); res(b.dataset.v || null); });
    document.body.appendChild(d);
  });
}
function abrirHoja(html, onMount){
  const o = document.createElement('div'); o.className = 'overlay';
  o.innerHTML = `<div class="sheet"><div class="grab"></div>${html}</div>`;
  o.addEventListener('click', e => { if (e.target === o) cerrar(); });
  function cerrar(){ o.remove(); document.body.style.overflow = ''; }
  document.body.appendChild(o); document.body.style.overflow = 'hidden';
  onMount && onMount(o.querySelector('.sheet'), cerrar);
  return cerrar;
}
async function compartirArchivo(blob, nombre){
  const file = new File([blob], nombre, { type: blob.type });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: nombre }); return; }
  } catch(e){ if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nombre;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function refrescarListas(){
  const trats = new Map();
  D.tratamientos.forEach(t => trats.set(norm(t.nombre), t.nombre));
  $('#dl-trat').innerHTML = [...trats.values()].map(n => `<option value="${esc(n)}">`).join('');
  const pacs = new Map();
  [...D.registros].sort((a,b) => b.fecha.localeCompare(a.fecha)).forEach(r => { const k = norm(r.paciente); if (k && !pacs.has(k)) pacs.set(k, r.paciente.trim()); });
  $('#dl-pac').innerHTML = [...pacs.values()].map(n => `<option value="${esc(n)}">`).join('');
}

/* ---------- navegación ---------- */
$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  UI.tab = b.dataset.tab; render(); window.scrollTo(0,0);
});
$('#fab').addEventListener('click', () => editarRegistro(null, { fecha: UI.tab === 'jornada' ? UI.dia : today() }));

function render(){
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === UI.tab));
  $('#fab').style.display = (UI.tab === 'ajustes') ? 'none' : '';
  ({ jornada: vJornada, resumen: vResumen, pacientes: vPacientes, ajustes: vAjustes })[UI.tab]();
  refrescarListas();
}
function setHeader(t, s=''){ $('#title').textContent = t; $('#subtitle').textContent = s; }

function chipsClinicas(){
  if (D.clinicas.length < 2) return '';
  return `<div class="chips" id="chips"><button class="chip ${UI.filtro==='todas'?'on':''}" data-c="todas">Todas</button>${
    D.clinicas.map(c => `<button class="chip ${UI.filtro===c.id?'on':''}" data-c="${c.id}"><span class="dot" style="background:${c.color}"></span>${esc(c.nombre)}</button>`).join('')}</div>`;
}
function bindChips(){
  const ch = $('#chips'); if (!ch) return;
  ch.addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; UI.filtro = b.dataset.c; render(); });
}
const filtrar = regs => UI.filtro === 'todas' ? regs : regs.filter(r => r.clinicaId === UI.filtro);

function filaRegistro(r){
  const c = clinica(r.clinicaId), k = calc(r);
  return `<div class="item" data-id="${r.id}">
    <span class="dot" style="background:${c.color};margin-top:7px"></span>
    <div class="main"><div class="t">${esc(r.paciente) || '<span class="muted">Sin nombre</span>'}</div>
      <div class="d">${esc(itemsTxt(r)) || '—'}</div>
      ${D.clinicas.length > 1 ? `<div class="d small">${esc(c.nombre)} · ${pctTxt(r.pct)}${k.lab ? ' · lab. ' + eur(k.lab) : ''}</div>` : (k.lab ? `<div class="d small">lab. ${eur(k.lab)}</div>` : '')}
    </div>
    <div class="r num"><div>${eur(k.total)}</div><div class="a">${eur(k.fact)}</div></div></div>`;
}
function bindFilas(root=document){
  root.querySelectorAll('.item[data-id]').forEach(el => el.addEventListener('click', () => {
    const r = D.registros.find(x => x.id === el.dataset.id); if (r) editarRegistro(r);
  }));
}
function bannerCopia(){
  if (!D.registros.length) return '';
  const dias = D.ultimaCopia ? (Date.now() - D.ultimaCopia) / 864e5 : 999;
  if (dias < 14) return '';
  return `<div class="banner">💾 ${D.ultimaCopia ? 'Hace más de 2 semanas que no haces' : 'Aún no has hecho'} una copia de seguridad. <a href="#" id="go-copia" style="color:inherit;font-weight:700">Hacer copia ahora</a></div>`;
}
function bindBanner(){ const a = $('#go-copia'); if (a) a.addEventListener('click', e => { e.preventDefault(); exportarCopia(); }); }

/* ---------- vista: Jornada ---------- */
function vJornada(){
  setHeader('Jornada', '');
  const regs = filtrar(D.registros.filter(r => r.fecha === UI.dia));
  const s = sumar(regs);
  const porClin = {};
  regs.forEach(r => (porClin[r.clinicaId] ||= []).push(r));
  let listas = '';
  if (!regs.length) listas = `<div class="empty"><div class="e">🦷</div>No hay tratamientos este día.<br>Pulsa <b>+</b> para añadir uno.</div>`;
  else Object.entries(porClin).forEach(([cid, rs]) => {
    const c = clinica(cid), sc = sumar(rs);
    listas += `<div class="sec"><span><span class="dot" style="background:${c.color}"></span> ${esc(c.nombre)} · ${pctTxt(c.pct)}</span><span class="num">${eur(sc.fact)}</span></div>
      <div class="list">${rs.map(filaRegistro).join('')}</div>`;
  });
  $('#main').innerHTML = `${bannerCopia()}
    <div class="datebar"><button class="iconbtn" id="d-prev">‹</button>
      <div class="lbl">${UI.dia === today() ? 'Hoy, ' + fechaLarga(UI.dia) : cap(fechaLarga(UI.dia))}<input type="date" id="d-pick" value="${UI.dia}"></div>
      <button class="iconbtn" id="d-next">›</button></div>
    ${chipsClinicas()}
    <div class="stats"><div class="stat"><div class="l">Pacientes</div><div class="v num">${s.pac}</div></div>
      <div class="stat"><div class="l">Total precio</div><div class="v num">${eur(s.total)}</div></div>
      <div class="stat hl"><div class="l">A facturar</div><div class="v num">${eur(s.fact)}</div></div></div>
    ${listas}
    ${UI.dia !== today() ? '<button class="btn ghost" id="d-hoy">Ir a hoy</button>' : ''}`;
  const mover = n => { const d = parseISO(UI.dia); d.setDate(d.getDate()+n); UI.dia = isoDate(d); render(); };
  $('#d-prev').onclick = () => mover(-1); $('#d-next').onclick = () => mover(1);
  $('#d-pick').onchange = e => { if (e.target.value) { UI.dia = e.target.value; render(); } };
  const h = $('#d-hoy'); if (h) h.onclick = () => { UI.dia = today(); render(); };
  bindChips(); bindFilas(); bindBanner();
}

/* ---------- vista: Resumen ---------- */
function vResumen(){
  const [y, m] = UI.mes.split('-').map(Number);
  setHeader('Resumen', `${MESES[m-1]} ${y}`);
  const delMes = D.registros.filter(r => r.fecha.startsWith(UI.mes));
  const regs = filtrar(delMes);
  const s = sumar(regs);
  // por clínica
  const clinIds = [...new Set(delMes.map(r => r.clinicaId))];
  const tarjetas = clinIds.filter(id => UI.filtro === 'todas' || id === UI.filtro).map(id => {
    const c = clinica(id), sc = sumar(delMes.filter(r => r.clinicaId === id));
    return `<div class="card"><div class="row between"><div class="row"><span class="dot" style="background:${c.color}"></span><b>${esc(c.nombre)}</b></div><span class="muted small">${pctTxt(c.pct)}${c.descLab?' · descuenta lab.':''}</span></div>
      <table class="t" style="margin-top:6px"><tr><td>Tratamientos registrados</td><td class="num">${sc.n}</td></tr>
      <tr><td>Total precio</td><td class="num">${eur(sc.total)}</td></tr>
      <tr class="tot"><td>A facturar a la clínica</td><td class="num" style="color:var(--accent)">${eur(sc.fact)}</td></tr></table></div>`;
  }).join('');
  // por día
  const dias = {};
  regs.forEach(r => (dias[r.fecha] ||= []).push(r));
  const filasDias = Object.keys(dias).sort().map(f => { const sd = sumar(dias[f]);
    return `<tr data-f="${f}"><td>${fechaCorta(f)}</td><td class="num">${sd.n}</td><td class="num">${eur(sd.total)}</td><td class="num"><b>${eur(sd.fact)}</b></td></tr>`; }).join('');
  // año
  const filasAnio = MESES.map((nm, i) => {
    const pref = `${y}-${pad(i+1)}`; const sa = sumar(filtrar(D.registros.filter(r => r.fecha.startsWith(pref))));
    return sa.n ? `<tr><td>${nm}</td><td class="num">${sa.n}</td><td class="num">${eur(sa.total)}</td><td class="num"><b>${eur(sa.fact)}</b></td></tr>` : '';
  }).join('');
  const sy = sumar(filtrar(D.registros.filter(r => r.fecha.startsWith(String(y)))));

  $('#main').innerHTML = `${bannerCopia()}
    <div class="datebar"><button class="iconbtn" id="m-prev">‹</button><div class="lbl">${MESES[m-1]} ${y}<input type="month" id="m-pick" value="${UI.mes}"></div><button class="iconbtn" id="m-next">›</button></div>
    ${chipsClinicas()}
    <div class="stats"><div class="stat"><div class="l">Tratamientos</div><div class="v num">${s.n}</div></div>
      <div class="stat"><div class="l">Total precio</div><div class="v num">${eur(s.total)}</div></div>
      <div class="stat hl"><div class="l">A facturar</div><div class="v num">${eur(s.fact)}</div></div></div>
    ${regs.length ? `<div class="sec"><span>Por clínica</span></div>${tarjetas}
    <div class="btns" style="margin:4px 0 6px"><button class="btn" id="exp-xlsx">📤 Exportar Excel del mes</button></div>
    <div class="sec"><span>Por día</span><span>toca un día para verlo</span></div>
    <div class="card"><table class="t" id="t-dias"><tr><th>Día</th><th>Nº</th><th>Precio</th><th>A facturar</th></tr>${filasDias}
      <tr class="tot"><td>Total</td><td class="num">${s.n}</td><td class="num">${eur(s.total)}</td><td class="num">${eur(s.fact)}</td></tr></table></div>`
    : `<div class="empty"><div class="e">📅</div>No hay registros en ${MESES[m-1].toLowerCase()}.</div>`}
    ${sy.n ? `<div class="sec"><span>Año ${y}</span></div><div class="card"><table class="t"><tr><th>Mes</th><th>Nº</th><th>Precio</th><th>A facturar</th></tr>${filasAnio}
      <tr class="tot"><td>Total ${y}</td><td class="num">${sy.n}</td><td class="num">${eur(sy.total)}</td><td class="num">${eur(sy.fact)}</td></tr></table></div>` : ''}`;
  const mover = n => { const d = new Date(y, m-1+n, 1); UI.mes = `${d.getFullYear()}-${pad(d.getMonth()+1)}`; render(); };
  $('#m-prev').onclick = () => mover(-1); $('#m-next').onclick = () => mover(1);
  $('#m-pick').onchange = e => { if (e.target.value) { UI.mes = e.target.value; render(); } };
  const ex = $('#exp-xlsx'); if (ex) ex.onclick = () => exportarExcelMes(UI.mes);
  document.querySelectorAll('#t-dias tr[data-f]').forEach(tr => tr.onclick = () => { UI.dia = tr.dataset.f; UI.tab = 'jornada'; render(); window.scrollTo(0,0); });
  bindChips(); bindBanner();
}

/* ---------- vista: Pacientes ---------- */
function vPacientes(){
  setHeader('Pacientes', '');
  const mapa = new Map();
  D.registros.forEach(r => {
    const k = norm(r.paciente); if (!k) return;
    const p = mapa.get(k) || { nombre: r.paciente.trim(), regs: [] };
    p.regs.push(r); mapa.set(k, p);
  });
  const q = norm(UI.busca);
  const lista = [...mapa.values()].filter(p => !q || norm(p.nombre).includes(q))
    .map(p => { p.regs.sort((a,b) => b.fecha.localeCompare(a.fecha)); p.ult = p.regs[0].fecha; p.s = sumar(p.regs); return p; })
    .sort((a,b) => b.ult.localeCompare(a.ult));
  $('#main').innerHTML = `<div class="field"><input id="busca" type="search" placeholder="🔍 Buscar paciente" value="${esc(UI.busca)}" autocomplete="off"></div>
    <div class="muted small" style="margin:0 4px 8px">${mapa.size} pacientes</div>
    ${lista.length ? `<div class="list">${lista.map(p => `<div class="item" data-k="${esc(norm(p.nombre))}"><div class="main"><div class="t">${esc(p.nombre)}</div>
      <div class="d">${p.regs.length} visita${p.regs.length>1?'s':''} · última ${fechaCorta(p.ult)}</div></div>
      <div class="r num"><div>${eur(p.s.total)}</div><div class="a">${eur(p.s.fact)}</div></div></div>`).join('')}</div>`
      : `<div class="empty"><div class="e">👤</div>${q ? 'Ningún paciente coincide.' : 'Los pacientes aparecerán aquí al registrar tratamientos.'}</div>`}`;
  const b = $('#busca');
  b.oninput = () => { UI.busca = b.value; const pos = b.selectionStart; vPacientes(); const nb = $('#busca'); nb.focus(); nb.setSelectionRange(pos,pos); };
  document.querySelectorAll('.item[data-k]').forEach(el => el.onclick = () => fichaPaciente(mapa.get(el.dataset.k)));
}
function fichaPaciente(p){
  const regs = [...p.regs].sort((a,b) => b.fecha.localeCompare(a.fecha));
  const s = sumar(regs);
  abrirHoja(`<h2>${esc(p.nombre)}<button data-x>Cerrar</button></h2>
    <div class="stats" style="margin-bottom:12px"><div class="stat"><div class="l">Visitas</div><div class="v">${s.n}</div></div>
    <div class="stat"><div class="l">Total</div><div class="v num">${eur(s.total)}</div></div><div class="stat hl"><div class="l">Facturado</div><div class="v num">${eur(s.fact)}</div></div></div>
    <div class="list">${regs.map(r => filaRegistro(r).replace(`<div class="t">${esc(r.paciente)}</div>`, `<div class="t">${fechaCorta(r.fecha)}</div>`)).join('')}</div>
    <button class="btn" data-nuevo>+ Nuevo tratamiento para ${esc(p.nombre)}</button>`, (el, cerrar) => {
    el.querySelector('[data-x]').onclick = cerrar;
    el.querySelector('[data-nuevo]').onclick = () => { cerrar(); editarRegistro(null, { fecha: today(), paciente: p.nombre }); };
    el.querySelectorAll('.item[data-id]').forEach(it => it.onclick = () => { const r = D.registros.find(x => x.id === it.dataset.id); cerrar(); editarRegistro(r); });
  });
}

/* ---------- formulario de registro ---------- */
function ultimoPrecio(trat, clinicaId){
  const k = norm(trat);
  const regs = [...D.registros].sort((a,b) => b.fecha.localeCompare(a.fecha));
  for (const r of regs) { if (r.clinicaId !== clinicaId) continue;
    for (const i of r.items) if (norm(i.trat) === k && num(i.precio) > 0) return num(i.precio); }
  const t = D.tratamientos.find(t => norm(t.nombre) === k);
  return t && t.precio ? t.precio : '';
}
function tratFrecuentes(){
  const cat = new Map(D.tratamientos.map(t => [norm(t.nombre), t.nombre]));
  const cont = {};
  D.registros.forEach(r => r.items.forEach(i => { const k = norm(i.trat); if (cat.has(k)) cont[k] = (cont[k]||0) + 1; }));
  const top = Object.entries(cont).sort((a,b) => b[1]-a[1]).map(e => cat.get(e[0])).slice(0,6);
  return top.length >= 3 ? top : ['Limpieza dental','Empaste','Extracción','Curetaje','Abfracción','Endodoncia'];
}
function editarRegistro(r, pre={}){
  const nuevo = !r;
  const activas = clinicasActivas();
  const cid0 = r ? r.clinicaId : (UI.filtro !== 'todas' && D.clinicas.some(c=>c.id===UI.filtro) ? UI.filtro : (activas.find(c => c.id === D.ultimaClinica) || activas[0] || D.clinicas[0]).id);
  const st = r ? JSON.parse(JSON.stringify(r)) : pre.plantilla ? Object.assign(JSON.parse(JSON.stringify(pre.plantilla)), { id: uid(), fecha: today() }) : { id: uid(), fecha: pre.fecha || today(), clinicaId: cid0, paciente: pre.paciente || '', items: [{ trat:'', piezas:'', precio:'' }], pct: clinica(cid0).pct, lab: '', nota: '' };
  const clinsForm = D.clinicas.filter(c => !c.archivada || c.id === st.clinicaId);

  const html = `<h2>${nuevo ? 'Nuevo tratamiento' : 'Editar'}<button data-x>Cancelar</button></h2>
    <div class="field"><label>Fecha</label><input type="date" id="f-fecha" value="${st.fecha}"></div>
    ${clinsForm.length > 1 ? `<div class="field"><label>Clínica</label><div class="chips" id="f-clin">${clinsForm.map(c => `<button type="button" class="chip ${c.id===st.clinicaId?'on':''}" data-c="${c.id}"><span class="dot" style="background:${c.color}"></span>${esc(c.nombre)} · ${pctTxt(c.pct)}</button>`).join('')}</div></div>` : ''}
    <div class="field"><label>Paciente</label><input id="f-pac" list="dl-pac" placeholder="Nombre y apellidos" value="${esc(st.paciente)}" autocomplete="off" autocapitalize="words"></div>
    <div class="field"><label>Tratamientos</label><div id="f-items"></div>
      <div class="quick" id="f-quick">${tratFrecuentes().map(t => `<button type="button" data-t="${esc(t)}">+ ${esc(t)}</button>`).join('')}</div>
      <button type="button" class="btn sec2" id="f-add">+ Añadir otro tratamiento</button></div>
    <details id="f-mas" ${(!nuevo && (num(st.pct) !== clinica(st.clinicaId).pct || num(st.lab) || st.nota)) ? 'open' : ''}><summary>Más opciones (%, laboratorio, nota) ›</summary>
      <div class="row" style="gap:8px"><div class="field" style="flex:1"><label>% para este registro</label><input id="f-pct" inputmode="decimal" value="${String(st.pct).replace('.',',')}"></div>
      <div class="field" style="flex:1" id="f-labw"><label>Coste laboratorio (€)</label><input id="f-lab" inputmode="decimal" placeholder="0" value="${st.lab === '' ? '' : String(st.lab).replace('.',',')}"></div></div>
      <div class="muted small" id="f-labinfo" style="margin:-6px 4px 10px"></div>
      <div class="field"><label>Nota</label><textarea id="f-nota" rows="2" placeholder="Opcional">${esc(st.nota)}</textarea></div>
    </details>
    <div class="totbox"><div class="row"><span>Total tratamiento</span><span class="num" id="f-tot"></span></div>
      <div class="row" style="margin-top:4px"><span id="f-pctlbl"></span><span class="big num" id="f-fact"></span></div></div>
    <div class="btns"><button class="btn" id="f-save">${nuevo ? 'Guardar' : 'Guardar cambios'}</button>
      ${nuevo ? '<button class="btn sec2" id="f-save2">Guardar y añadir otro</button>' : '<button class="btn sec2" id="f-dup">Duplicar</button><button class="btn danger" id="f-del">Eliminar</button>'}</div>`;

  abrirHoja(html, (el, cerrar) => {
    const box = el.querySelector('#f-items');
    function pintarItems(){
      box.innerHTML = st.items.map((it, i) => `<div class="trow" data-i="${i}">
        ${st.items.length > 1 ? `<button type="button" class="x" data-del="${i}">×</button>` : ''}
        <input class="full" data-k="trat" list="dl-trat" placeholder="Tratamiento (p. ej. Empaste)" value="${esc(it.trat)}" autocomplete="off">
        <input data-k="piezas" placeholder="Pieza(s): 36, 37" value="${esc(it.piezas)}" autocomplete="off">
        <input data-k="precio" inputmode="decimal" placeholder="Precio €" value="${it.precio === '' ? '' : String(it.precio).replace('.',',')}"></div>`).join('');
    }
    function totales(){
      st.pct = num(el.querySelector('#f-pct').value);
      st.lab = el.querySelector('#f-lab').value;
      const c = clinica(st.clinicaId);
      el.querySelector('#f-labw').style.display = c.descLab ? '' : 'none';
      el.querySelector('#f-labinfo').textContent = c.descLab ? 'En esta clínica el coste de laboratorio se descuenta antes de aplicar el %.' : '';
      const k = calc(st);
      el.querySelector('#f-tot').textContent = eur(k.total);
      el.querySelector('#f-pctlbl').textContent = `A facturar (${pctTxt(st.pct)}${k.lab ? ', tras lab.' : ''})`;
      el.querySelector('#f-fact').textContent = eur(k.fact);
    }
    pintarItems(); totales();
    box.addEventListener('input', e => {
      const row = e.target.closest('.trow'); if (!row) return;
      const it = st.items[+row.dataset.i]; it[e.target.dataset.k] = e.target.value; totales();
    });
    box.addEventListener('change', e => { // al elegir tratamiento: propone precio
      if (e.target.dataset.k !== 'trat') return;
      const row = e.target.closest('.trow'), it = st.items[+row.dataset.i];
      if (String(it.precio).trim() === '') { const p = ultimoPrecio(it.trat, st.clinicaId); if (p !== '') { it.precio = p; row.querySelector('[data-k=precio]').value = String(p).replace('.',','); totales(); } }
    });
    box.addEventListener('click', e => { const d = e.target.dataset.del; if (d !== undefined) { st.items.splice(+d,1); pintarItems(); totales(); } });
    el.querySelector('#f-add').onclick = () => { st.items.push({ trat:'', piezas:'', precio:'' }); pintarItems(); totales(); box.querySelector('.trow:last-child [data-k=trat]').focus(); };
    el.querySelector('#f-quick').onclick = e => {
      const b = e.target.closest('button'); if (!b) return;
      const t = b.dataset.t, p = ultimoPrecio(t, st.clinicaId);
      const vacio = st.items.find(i => !i.trat.trim() && String(i.precio).trim() === '');
      if (vacio) { vacio.trat = t; vacio.precio = p; } else st.items.push({ trat: t, piezas: '', precio: p });
      pintarItems(); totales();
    };
    const cl = el.querySelector('#f-clin');
    if (cl) cl.onclick = e => { const b = e.target.closest('.chip'); if (!b) return;
      st.clinicaId = b.dataset.c; cl.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === b));
      el.querySelector('#f-pct').value = String(clinica(st.clinicaId).pct).replace('.',','); totales(); };
    el.querySelector('#f-pct').oninput = totales; el.querySelector('#f-lab').oninput = totales;
    el.querySelector('[data-x]').onclick = cerrar;

    function recoger(){
      st.fecha = el.querySelector('#f-fecha').value || today();
      st.paciente = el.querySelector('#f-pac').value.trim();
      st.nota = el.querySelector('#f-nota').value.trim();
      st.pct = num(el.querySelector('#f-pct').value);
      st.lab = num(el.querySelector('#f-lab').value) || '';
      st.items = st.items.map(i => ({ trat: i.trat.trim(), piezas: i.piezas.trim(), precio: num(i.precio) })).filter(i => i.trat || i.precio);
      if (!st.items.length) { toast('Añade al menos un tratamiento con precio'); return false; }
      return true;
    }
    function guardar(){
      if (!recoger()) return false;
      // añade al catálogo tratamientos nuevos
      st.items.forEach(i => { if (i.trat && !D.tratamientos.some(t => norm(t.nombre) === norm(i.trat))) D.tratamientos.push({ id: uid(), nombre: i.trat, precio: 0 }); });
      const ix = D.registros.findIndex(x => x.id === st.id);
      if (ix >= 0) D.registros[ix] = st; else D.registros.push(st);
      D.ultimaClinica = st.clinicaId; save();
      UI.dia = st.fecha; if (UI.tab === 'jornada') {}
      return true;
    }
    el.querySelector('#f-save').onclick = () => { if (guardar()) { cerrar(); render(); toast('Guardado ✓'); } };
    const s2 = el.querySelector('#f-save2');
    if (s2) s2.onclick = () => { if (guardar()) { cerrar(); render(); toast('Guardado ✓'); editarRegistro(null, { fecha: st.fecha }); } };
    const del = el.querySelector('#f-del');
    if (del) del.onclick = async () => { if (await confirmar('¿Eliminar este registro?', 'Eliminar', true)) { D.registros = D.registros.filter(x => x.id !== st.id); save(); cerrar(); render(); toast('Eliminado'); } };
    const dup = el.querySelector('#f-dup');
    if (dup) dup.onclick = () => { if (!recoger()) return; cerrar(); editarRegistro(null, { plantilla: st }); };
    if (nuevo && !st.paciente) setTimeout(() => el.querySelector('#f-pac').focus(), 250);
  });
}

    <div class="muted small" style="text-align:center;margin-top:8px">${n} registros guardados · Factura Dental v1</div>`;
  document.querySelectorAll('.item[data-c]').forEach(el => el.onclick = () => editarClinica(D.clinicas.find(c => c.id === el.dataset.c)));
  $('#a-addc').onclick = () => editarClinica(null);
  $('#a-trat').onclick = editarTratamientos;
  $('#a-exp').onclick = exportarCopia;
  $('#a-imp').onclick = () => $('#a-file').click();
  $('#a-file').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) restaurarCopia(f); };
  $('#a-xlsx').onclick = () => $('#a-xfile').click();
  $('#a-xfile').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) importarExcel(f); };
  $('#a-xall').onclick = () => exportarExcelTodo();
  $('#a-borrar').onclick = async () => {
    if (!await confirmar('Se borrarán <b>todos</b> los registros, clínicas y tratamientos de este iPhone. ¿Seguro?', 'Borrar todo', true)) return;
    if (!await confirmar('Última confirmación: esto no se puede deshacer. Si no tienes copia, cancela.', 'Sí, borrar', true)) return;
    D = defaults(); save(); render(); toast('Datos borrados');
  };
}
function editarClinica(c){
  const nueva = !c;
  const st = c ? { ...c } : { id: uid(), nombre: '', pct: 40, color: COLORS[D.clinicas.length % COLORS.length], descLab: false, archivada: false };
  const nRegs = c ? D.registros.filter(r => r.clinicaId === c.id).length : 0;
  abrirHoja(`<h2>${nueva ? 'Nueva clínica' : 'Editar clínica'}<button data-x>Cancelar</button></h2>
    <div class="field"><label>Nombre</label><input id="c-nom" value="${esc(st.nombre)}" placeholder="Nombre de la clínica" autocapitalize="words"></div>
    <div class="field"><label>% que se factura a la clínica</label><input id="c-pct" inputmode="decimal" value="${String(st.pct).replace('.',',')}"></div>
    <label class="switch"><span>Descontar coste de laboratorio antes de aplicar el %</span><input type="checkbox" id="c-lab" ${st.descLab?'checked':''}></label>
    <div class="field"><label>Color</label><div class="colors" id="c-col">${COLORS.map(x => `<button type="button" style="background:${x}" class="${x===st.color?'on':''}" data-col="${x}"></button>`).join('')}</div></div>
    <div class="btns"><button class="btn" id="c-save">Guardar</button>
    ${!nueva ? (nRegs ? `<button class="btn sec2" id="c-arch">${st.archivada ? 'Reactivar clínica' : 'Archivar (ya no trabaja aquí)'}</button>` : '<button class="btn danger" id="c-del">Eliminar clínica</button>') : ''}</div>`,
  (el, cerrar) => {
    el.querySelector('[data-x]').onclick = cerrar;
    el.querySelector('#c-col').onclick = e => { const b = e.target.closest('button'); if (!b) return; st.color = b.dataset.col; el.querySelectorAll('#c-col button').forEach(x => x.classList.toggle('on', x === b)); };
    el.querySelector('#c-save').onclick = async () => {
      st.nombre = el.querySelector('#c-nom').value.trim() || 'Clínica';
      st.pct = num(el.querySelector('#c-pct').value);
      st.descLab = el.querySelector('#c-lab').checked;
      if (nueva) { D.clinicas.push(st); }
      else {
        if (st.pct !== c.pct && nRegs) {
          const v = await elegir(`Has cambiado el % de <b>${esc(st.nombre)}</b> de ${pctTxt(c.pct)} a ${pctTxt(st.pct)}. ¿A qué registros se aplica?`,
            [{ v: 'nuevos', t: 'Solo a los nuevos' }, { v: 'mes', t: 'Desde el mes actual' }, { v: 'todos', t: `A todos (${nRegs})` }]);
          if (!v) return;
          const desde = today().slice(0,7);
          D.registros.forEach(r => { if (r.clinicaId !== c.id || num(r.pct) !== c.pct) return;
            if (v === 'todos' || (v === 'mes' && r.fecha.slice(0,7) >= desde)) r.pct = st.pct; });
        }
        Object.assign(c, st);
      }
      save(); cerrar(); render(); toast('Clínica guardada');
    };
    const a = el.querySelector('#c-arch'); if (a) a.onclick = () => { c.archivada = !c.archivada; save(); cerrar(); render(); };
    const d = el.querySelector('#c-del'); if (d) d.onclick = async () => {
      if (D.clinicas.length < 2) { toast('Debe quedar al menos una clínica'); return; }
      if (await confirmar(`¿Eliminar ${esc(c.nombre)}?`, 'Eliminar', true)) { D.clinicas = D.clinicas.filter(x => x.id !== c.id); if (UI.filtro === c.id) UI.filtro = 'todas'; save(); cerrar(); render(); } };
    if (nueva) setTimeout(() => el.querySelector('#c-nom').focus(), 250);
  });
}
function editarTratamientos(){
  const lista = D.tratamientos.map(t => ({ ...t }));
  abrirHoja(`<h2>Tratamientos<button data-x>Cancelar</button></h2>
    <div class="muted small" style="margin:0 4px 10px">Precio por defecto (déjalo vacío si varía). Desliza para ver todos.</div>
    <div id="t-list"></div><button class="btn sec2" id="t-add" style="margin-bottom:8px">+ Añadir tratamiento</button>
    <button class="btn" id="t-save">Guardar lista</button>`, (el, cerrar) => {
    const box = el.querySelector('#t-list');
    const pintar = () => box.innerHTML = lista.map((t, i) => `<div class="trow" data-i="${i}"><button type="button" class="x" data-del="${i}">×</button>
      <input data-k="nombre" value="${esc(t.nombre)}" placeholder="Nombre"><input data-k="precio" inputmode="decimal" placeholder="€" value="${t.precio ? String(t.precio).replace('.',',') : ''}"></div>`).join('');
    pintar();
    box.oninput = e => { const row = e.target.closest('.trow'); lista[+row.dataset.i][e.target.dataset.k] = e.target.value; };
    box.onclick = e => { const d = e.target.dataset.del; if (d !== undefined) { lista.splice(+d, 1); pintar(); } };
    el.querySelector('#t-add').onclick = () => { lista.push({ id: uid(), nombre: '', precio: '' }); pintar(); box.querySelector('.trow:last-child input').focus(); };
    el.querySelector('[data-x]').onclick = cerrar;
    el.querySelector('#t-save').onclick = () => {
      D.tratamientos = lista.filter(t => String(t.nombre).trim()).map(t => ({ id: t.id, nombre: String(t.nombre).trim(), precio: num(t.precio) }))
        .sort((a,b) => a.nombre.localeCompare(b.nombre, 'es'));
      save(); cerrar(); render(); toast('Lista guardada');
    };
  });
}

/* ---------- copias de seguridad ---------- */
async function exportarCopia(){
  const blob = new Blob([JSON.stringify({ app: 'factura-dental', version: 1, fecha: new Date().toISOString(), datos: D }, null, 1)], { type: 'application/json' });
  await compartirArchivo(blob, `copia-factura-dental-${today()}.json`);
  D.ultimaCopia = Date.now(); save(); render();
}
async function restaurarCopia(file){
  try {
    const j = JSON.parse(await file.text());
    const datos = j.datos || j;
    if (!Array.isArray(datos.registros) || !Array.isArray(datos.clinicas)) throw new Error('formato');
    const v = await elegir(`La copia tiene <b>${datos.registros.length}</b> registros y ${datos.clinicas.length} clínicas. ¿Qué quieres hacer?`,
      [{ v: 'reemplazar', t: 'Reemplazar lo que hay en el iPhone' }, { v: 'combinar', t: 'Combinar (añadir lo que falte)' }]);
    if (!v) return;
    if (v === 'reemplazar') D = Object.assign(defaults(), datos);
    else {
      datos.clinicas.forEach(c => { if (!D.clinicas.some(x => x.id === c.id)) D.clinicas.push(c); });
      datos.registros.forEach(r => { if (!D.registros.some(x => x.id === r.id)) D.registros.push(r); });
      datos.tratamientos?.forEach(t => { if (!D.tratamientos.some(x => norm(x.nombre) === norm(t.nombre))) D.tratamientos.push(t); });
    }
    save(); render(); toast('Copia restaurada ✓');
  } catch(e){ toast('Ese archivo no es una copia válida'); }
}

/* ---------- Excel ---------- */
function hojaClinica(c, regs, titulo){
  const s = sumar(regs);
  const aoa = [
    [`CONTROL DE FACTURACIÓN – ${c.nombre.toUpperCase()}`], [titulo],
    ['% que se factura:', c.pct/100, '', 'Total precio:', s.total], ['', '', '', 'Total a facturar:', s.fact], [],
    ['Fecha','Paciente','Tratamiento','Precio tratamiento (€)','%','Coste lab. (€)','A facturar (€)','Nota']
  ];
  const ordenados = [...regs].sort((a,b) => a.fecha.localeCompare(b.fecha));
  let diaPrev = null, inicio = aoa.length;
  ordenados.forEach((r, i) => {
    const k = calc(r);
    aoa.push([parseISO(r.fecha), r.paciente, itemsTxt(r), k.total, num(r.pct)/100, k.lab || '', k.fact, r.nota || '']);
  });
  // subtotales por día (como la columna F del Excel original)
  aoa.push([]); aoa.push(['TOTAL', '', '', s.total, '', '', s.fact]);
  aoa.push([]); aoa.push(['Subtotales por día']); aoa.push(['Fecha','Nº','Precio (€)','A facturar (€)']);
  const dias = {}; ordenados.forEach(r => (dias[r.fecha] ||= []).push(r));
  Object.keys(dias).sort().forEach(f => { const sd = sumar(dias[f]); aoa.push([parseISO(f), sd.n, sd.total, sd.fact]); });
  const ws = XLSX.utils.aoa_to_sheet(aoa, { cellDates: true });
  ws['!cols'] = [{wch:12},{wch:28},{wch:42},{wch:14},{wch:7},{wch:12},{wch:14},{wch:24}];
  Object.keys(ws).forEach(ref => { const cell = ws[ref]; if (ref[0] === '!') return;
    if (cell.t === 'd' || cell.v instanceof Date) cell.z = 'dd/mm/yyyy';
    else if (cell.t === 'n') { const col = XLSX.utils.decode_cell(ref).c; const row = XLSX.utils.decode_cell(ref).r;
      if ((col === 4 && row >= inicio) || (ref === 'B3')) cell.z = '0%'; else if (col !== 1 || row < inicio) cell.z = '#,##0.00 €'; } });
  return ws;
}
function nombreHoja(s, usados){
  let n = s.replace(/[\\/?*\[\]:]/g, '').slice(0, 28) || 'Hoja'; let k = n, i = 2;
  while (usados.has(k)) k = n.slice(0, 26) + ' ' + i++;
  usados.add(k); return k;
}
function libroDe(regs, titulo){
  const wb = XLSX.utils.book_new(), usados = new Set();
  // Resumen
  const ids = [...new Set(regs.map(r => r.clinicaId))];
  const res = [[`RESUMEN – ${titulo}`], [], ['Clínica','%','Nº tratamientos','Total precio (€)','A facturar (€)']];
  ids.forEach(id => { const c = clinica(id), s = sumar(regs.filter(r => r.clinicaId === id)); res.push([c.nombre, c.pct/100, s.n, s.total, s.fact]); });
  const st = sumar(regs); res.push(['TOTAL', '', st.n, st.total, st.fact]);
  const wr = XLSX.utils.aoa_to_sheet(res); wr['!cols'] = [{wch:26},{wch:7},{wch:15},{wch:16},{wch:16}];
  Object.keys(wr).forEach(ref => { if (ref[0]==='!') return; const a = XLSX.utils.decode_cell(ref); if (wr[ref].t==='n' && a.r>2) wr[ref].z = a.c===1 ? '0%' : a.c===2 ? '0' : '#,##0.00 €'; });
  XLSX.utils.book_append_sheet(wb, wr, nombreHoja('Resumen', usados));
  ids.forEach(id => { const c = clinica(id); XLSX.utils.book_append_sheet(wb, hojaClinica(c, regs.filter(r => r.clinicaId === id), titulo), nombreHoja(c.nombre, usados)); });
  return wb;
}
async function exportarExcelMes(mes){
  const [y, m] = mes.split('-').map(Number);
  const regs = filtrar(D.registros.filter(r => r.fecha.startsWith(mes)));
  if (!regs.length) return toast('No hay registros ese mes');
  const titulo = `${MESES[m-1]} ${y}`;
  const out = XLSX.write(libroDe(regs, titulo), { bookType: 'xlsx', type: 'array', cellDates: true });
  const sufijo = UI.filtro !== 'todas' ? '_' + clinica(UI.filtro).nombre.replace(/\s+/g,'_') : '';
  await compartirArchivo(new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), `Facturacion_${MESES[m-1]}_${y}${sufijo}.xlsx`);
}
async function exportarExcelTodo(){
  if (!D.registros.length) return toast('No hay registros todavía');
  const out = XLSX.write(libroDe(D.registros, 'Todos los registros'), { bookType: 'xlsx', type: 'array', cellDates: true });
  await compartirArchivo(new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), `Facturacion_completa_${today()}.xlsx`);
}
async function importarExcel(file){
  try {
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
    const ws = wb.Sheets['Registro'] || wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
    // busca la fila de cabecera y el % del archivo
    let h = -1, pctArchivo = null;
    rows.forEach((row, i) => {
      const txt = row.map(c => norm(c));
      if (h < 0 && txt.some(t => t === 'fecha') && txt.some(t => t.startsWith('paciente'))) h = i;
      const k = txt.findIndex(t => t.includes('% que se factura')); if (k >= 0) { const v = row.slice(k+1).find(x => typeof x === 'number'); if (v != null) pctArchivo = v <= 1 ? v*100 : v; }
    });
    if (h < 0) throw new Error('No encuentro la cabecera (Fecha, Paciente…)');
    const cab = rows[h].map(c => norm(c));
    const col = pref => cab.findIndex(t => t.startsWith(pref));
    const cF = col('fecha'), cP = col('paciente'), cT = col('tratamiento'), cPr = cab.findIndex(t => t.startsWith('precio'));
    const nuevos = [];
    for (let i = h + 1; i < rows.length; i++) {
      const row = rows[i]; let f = row[cF]; const precio = num(row[cPr]);
      if (!f || !precio) continue;
      if (typeof f === 'number') f = new Date(Math.round((f - 25569) * 864e5));
      if (!(f instanceof Date)) { const m = String(f).match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/); if (!m) continue; f = new Date(+(m[3].length===2?'20'+m[3]:m[3]), +m[2]-1, +m[1]); }
      const fecha = isoDate(new Date(f.getTime() + 12*36e5)); // evita desfases de zona horaria
      // "Extracción 37" -> tratamiento "Extracción", pieza "37"
      let trat = String(row[cT] || '').trim().replace(/\s+/g,' '), piezas = '';
      const mm = !trat.includes('+') && trat.match(/^(.*?[^\d\s,])\s+(\d[\d\s,y\-]*)$/);
      if (mm) { trat = mm[1]; piezas = mm[2].trim(); }
      nuevos.push({ fecha, paciente: String(row[cP] || '').trim(), items: [{ trat, piezas, precio }] });
    }
    if (!nuevos.length) throw new Error('No hay filas con fecha y precio');
    const tot = r2(nuevos.reduce((s, r) => s + r.items[0].precio, 0));
    const opciones = D.clinicas.map(c => ({ v: c.id, t: `${c.nombre} (${pctTxt(c.pct)})` }));
    const cid = await elegir(`He encontrado <b>${nuevos.length}</b> tratamientos por un total de <b>${eur(tot)}</b>${pctArchivo ? ` (el archivo usa ${pctTxt(pctArchivo)})` : ''}.<br>¿A qué clínica pertenecen?`, opciones);
    if (!cid) return;
    const c = clinica(cid);
    const pct = pctArchivo ?? c.pct;
    const clave = r => [r.fecha, r.clinicaId, norm(r.paciente), norm(itemsTxt(r)), calc(r).total].join('|');
    const existentes = new Set(D.registros.map(clave));
    let n = 0;
    nuevos.forEach(r => { const reg = { id: uid(), clinicaId: cid, pct, lab: '', nota: '', ...r }; if (!existentes.has(clave(reg))) { D.registros.push(reg); n++; } });
    save(); UI.mes = nuevos[0].fecha.slice(0,7); UI.tab = 'resumen'; UI.filtro = 'todas'; render();
    toast(`${n} registros importados${n < nuevos.length ? ` (${nuevos.length - n} ya existían)` : ''} ✓`);
  } catch(e){ toast('No se pudo importar: ' + e.message); }
}

/* ---------- arranque ---------- */
render();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
</script>
